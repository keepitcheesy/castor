# Castor Configuration Example

# This file shows example configuration options for Castor.
# Currently, configuration is done through the Python code.
# Future versions may support loading configuration from this file.

[feeds]
# RSS feed update interval in seconds (default: 300 = 5 minutes)
fetch_interval = 300

[programs]
# Program generation interval in seconds (default: 600 = 10 minutes)
program_interval = 600

# Number of items per program (default: 5)
items_per_program = 5

[scoring]
# Weight for recency in scoring (0.0 - 1.0)
recency_weight = 0.4

# Weight for content quality in scoring (0.0 - 1.0)
quality_weight = 0.6

[anchors]
# Default cooldown period in minutes (default: 60)
default_cooldown = 60

[deduplication]
# Title similarity threshold (0.0 - 1.0)
# Higher values mean stricter matching
similarity_threshold = 0.8
